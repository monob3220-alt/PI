<label>Nome do aluno: <input [(ngModel)]="nomeAluno"></label>
<p>{{ nomeAluno }}</p>

<p>
  Disciplinas: {{ quantidadeDisciplinas }}
  <button (click)="diminuir()" [disabled]="quantidadeDisciplinas === 1">-</button>
  <button (click)="aumentar()">+</button>
</p>

<button (click)="matricular()" [disabled]="!nomePreenchido">Realizar Matrícula</button>

<p *ngIf="mensagem">{{ mensagem }}</p>
